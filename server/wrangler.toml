name = "topbio-assistente"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Quem pode falar com este endereço. Sem isto, qualquer site do mundo pode
# gastar a nossa quota da API a partir do navegador de qualquer pessoa.
#
# A origem do GitHub Pages é o domínio, sem o caminho do repositório:
# https://yurizin-sketch.github.io — e não .../topbio-smart-station.
ALLOWED_ORIGINS = "https://yurizin-sketch.github.io,http://localhost:5173"

# O modelo. Sonnet 5 é o equilíbrio certo para isto: responde numa fração de
# segundo e escreve português do Brasil decente.
#
# Se a conta ficar cara, "claude-haiku-4-5-20251001" custa uma fração e para
# duas frases e três botões a diferença quase não se nota.
MODEL = "claude-sonnet-5"

# Carteira a que a Anthropic háde cobrar.
#
# Só faz falta se a chave for pessoal -- as que a consola cria por omissão são.
# Sem isto, uma chave dessas devolve 400 e a Bia responde a fala escrita.
#
# Duas saídas, e a segunda é melhor:
#
#   1. Tirar o comentário abaixo e pôr o id do workspace. Está no endereço da
#      consola quando se abre o workspace, e começa por "wrkspc_".
#   2. Criar antes uma chave *dentro* de um workspace (Console > Settings >
#      Workspaces > escolher um > API keys). Essa já sabe a quem cobrar, e aí
#      esta linha fica como está: por usar.
#
# Não é segredo -- é um nome de gaveta, não abre nada. Por isso pode ficar aqui.
# ANTHROPIC_WORKSPACE_ID = "wrkspc_..."

# A voz da Bia na ElevenLabs. Sem isto preenchido, o tablet fala com as vozes
# que tiver instaladas — que no PC da loja são só de Portugal.
#
# O identificador tira-se em <https://elevenlabs.io/app/voice-library>: escolha
# uma voz feminina brasileira, adicione-a à conta e copie o "Voice ID".
ELEVENLABS_VOICE_ID = "7eNTDDQVOfe6PkLOmu23"

# Turbo v2.5 custa metade do multilingue e responde bem mais depressa, que é o
# que conta num balcão. Para mais qualidade: "eleven_multilingual_v2".
ELEVENLABS_MODEL = "eleven_turbo_v2_5"

# As chaves NÃO vêm aqui. Este ficheiro está no repositório e o repositório é
# público. Entram uma vez cada, por:
#
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ELEVENLABS_API_KEY
#
# e ficam guardadas no Cloudflare, cifradas, sem forma de serem lidas de volta.

# Cache das falas já geradas. Opcional, mas é a diferença entre pagar cada
# frase uma vez e pagá-la todas as vezes que alguém passa pela loja.
#
# Cria-se com:
#
#   npx wrangler kv namespace create TTS_CACHE
#
# O comando imprime um id, que é o que está aqui em baixo.

[[kv_namespaces]]
binding = "TTS_CACHE"
id = "aba57a5a683b468a8e7010a4cfad6124"
