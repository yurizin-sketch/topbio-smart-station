<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#002E26" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/media/brand/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="TopBio Smart Station — recomendação e compra assistida." />
    <title>TopBio Smart Station</title>

    <!--
      A Archivo é servida do próprio quiosque (ver src/styles/fonts.css).
      Nada aqui pode depender de fonts.googleapis.com: se a rede da loja cair,
      a estação tem de continuar igual.

      O preload é só do subconjunto latin — é o que praticamente todo o ecrã
      usa. O latin-ext entra a pedido, quando aparecer um caráter que o exija.
    -->
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
